name: ANC V3.1 — validation PR sans publication
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check assets/public.js
          node --check assets/demo-engine.js
          node --check assets/porchet-excel.js
          node --check assets/live-workflow.js
          node --check assets/geo-parcel.js
          node --check assets/live-controls.js
      - name: Install test tools
        run: npm install --no-audit --no-fund
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Run desktop/mobile browser tests
        run: npm run test:e2e
      - name: No confidential code in public repository
        run: |
          for dir in domain application repositories adapters integrations knowledge migration migrations tests e2e v3; do
            if [ -e "$dir" ]; then echo "Forbidden directory: $dir"; exit 1; fi
          done
