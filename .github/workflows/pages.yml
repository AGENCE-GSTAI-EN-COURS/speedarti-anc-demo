name: ANC public demo — verify and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: anc-public-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check assets/public.js
          node --check assets/demo-engine.js
          node --check assets/porchet-excel.js
          node --check assets/live-workflow.js
          node --check assets/geo-parcel.js
          node --check assets/live-controls.js
          node --check assets/map-runtime.js
      - name: Install public demo test tools
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test demo on desktop and mobile
        run: npm run test:e2e
      - name: Ensure private-source folders are absent
        run: |
          for dir in domain application repositories adapters integrations knowledge migration migrations tests e2e v3; do
            if [ -e "$dir" ]; then echo "Forbidden directory: $dir"; exit 1; fi
          done
          echo "Demo-only tree confirmed"
  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Collect only static demo files
        run: |
          mkdir -p site/assets site/sections
          cp index.html site/
          cp assets/original.css assets/public.css assets/public.js assets/demo-engine.js assets/porchet-excel.js assets/porchet-excel.css assets/live-workflow.js assets/geo-parcel.js assets/live-controls.js assets/map-runtime.js site/assets/
          cp sections/*.html site/sections/
          touch site/.nojekyll
          test "$(find site/sections -maxdepth 1 -name '*.html' | wc -l)" -eq 14
          test -f site/assets/public.js
          test -f site/assets/original.css
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke-live:
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer outils de recette
        run: npm install --no-audit --no-fund
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
      - name: Vérifier le VRAI site publié (PC + mobile)
        run: npx playwright test --config=playwright.live.config.mjs
